<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" fill="none">
  <defs>
    <!-- Emerald Green Gradient for Eye Outer Curve -->
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Warm Cashew Gold Gradient for Nut Pupil -->
    <linearGradient id="cashewGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F5B544" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22C55E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- LOGO ICON GROUP -->
  <g transform="translate(4, 5)">
    <!-- Eye Outer Contour -->
    <path d="M 4 20 C 11 8, 29 8, 36 20 C 29 32, 11 32, 4 20 Z" 
          stroke="url(#emeraldGradient)" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="#121816"
          filter="url(#eyeGlow)" />

    <!-- Stylized Cashew Nut (Pupil) -->
    <path d="M 17.5 16 C 21 13.5, 25 16, 24.5 19.5 C 24 22.5, 20.5 24.5, 18 23 C 15.8 21.7, 15 18, 17.5 16 Z" 
          fill="url(#cashewGoldGradient)" />

    <!-- Leaf Sprouting from Top Corner of Eye -->
    <path d="M 30 11 C 34 6, 38 8, 36 13 C 33 14.5, 30 13, 30 11 Z" 
          fill="url(#emeraldGradient)" />
    <path d="M 31 11.5 C 33.5 9, 36 10, 36 10" 
          stroke="#0B0F0E" 
          stroke-width="0.8" 
          stroke-linecap="round" />
  </g>

  <!-- WORDMARK -->
  <text x="54" y="32" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="25" letter-spacing="-0.5">
    <tspan fill="#FFFFFF" font-weight="600">Farm</tspan>
    <tspan fill="#22C55E" font-weight="800">Eye</tspan>
  </text>
</svg>
